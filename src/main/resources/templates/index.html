<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chamados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <h1 class="mb-4">Painel</h1>
    <div class="row g-3">
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h2 th:text="${totalChamados}"></h2>
                    <p class="text-muted mb-0">Chamados</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h2 th:text="${totalClientes}"></h2>
                    <p class="text-muted mb-0">Clientes</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h2 th:text="${totalCategorias}"></h2>
                    <p class="text-muted mb-0">Categorias</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h2 th:text="${totalTecnicos}"></h2>
                    <p class="text-muted mb-0">Técnicos</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row g-3 mt-4">
        <div class="col-md-3">
            <a class="btn btn-primary w-100" th:href="@{/web/chamados/novo}">Abrir chamado</a>
        </div>
        <div class="col-md-3">
            <a class="btn btn-outline-secondary w-100" th:href="@{/web/clientes/novo}">Novo cliente</a>
        </div>
        <div class="col-md-3">
            <a class="btn btn-outline-secondary w-100" th:href="@{/web/categorias/novo}">Nova categoria</a>
        </div>
        <div class="col-md-3">
            <a class="btn btn-outline-secondary w-100" th:href="@{/web/tecnicos/novo}">Novo técnico</a>
        </div>
    </div>
</div>
</body>
</html>
