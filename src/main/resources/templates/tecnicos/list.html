<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Técnicos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Técnicos</h1>
        <a class="btn btn-primary" th:href="@{/web/tecnicos/novo}">Novo técnico</a>
    </div>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Perfil</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="t : ${tecnicos}">
            <td th:text="${t.nome}"></td>
            <td th:text="${t.email}"></td>
            <td><span class="badge bg-secondary" th:text="${t.perfil}"></span></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/web/tecnicos/{id}/editar(id=${t.id})}">Editar</a>
                <form th:action="@{/web/tecnicos/{id}/excluir(id=${t.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Excluir este técnico?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(tecnicos)}">
            <td colspan="4" class="text-center text-muted">Nenhum técnico cadastrado</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
