<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chamados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Chamados</h1>
        <a class="btn btn-primary" th:href="@{/web/chamados/novo}">Abrir chamado</a>
    </div>

    <form method="get" th:action="@{/web/chamados}" class="row g-2 mb-3">
        <div class="col-md-3">
            <select class="form-select" name="status">
                <option value="">Status (todos)</option>
                <option th:each="s : ${statusValues}" th:value="${s}" th:text="${s}"
                        th:selected="${s == statusFiltro}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" name="prioridade">
                <option value="">Prioridade (todas)</option>
                <option th:each="p : ${prioridadeValues}" th:value="${p}" th:text="${p}"
                        th:selected="${p == prioridadeFiltro}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <select class="form-select" name="clienteId">
                <option value="">Cliente (todos)</option>
                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"
                        th:selected="${c.id == clienteIdFiltro}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <button class="btn btn-outline-primary w-100" type="submit">Filtrar</button>
        </div>
    </form>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>Título</th>
            <th>Cliente</th>
            <th>Categoria</th>
            <th>Prioridade</th>
            <th>Status</th>
            <th>Técnico</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${chamados.content}" style="cursor: pointer;"
            th:onclick="|window.location='@{/web/chamados/{id}(id=${c.id})}'|">
            <td th:text="${c.titulo}"></td>
            <td th:text="${c.clienteNome}"></td>
            <td th:text="${c.categoriaNome}"></td>
            <td th:text="${c.prioridade}"></td>
            <td th:text="${c.status}"></td>
            <td th:text="${c.tecnicoNome} ?: '—'"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/web/chamados/{id}/editar(id=${c.id})}"
                   onclick="event.stopPropagation()">Editar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(chamados.content)}">
            <td colspan="7" class="text-center text-muted">Nenhum chamado encontrado</td>
        </tr>
        </tbody>
    </table>

    <nav th:if="${chamados.totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, chamados.totalPages - 1)}"
                th:classappend="${i == chamados.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/web/chamados(status=${statusFiltro}, prioridade=${prioridadeFiltro}, clienteId=${clienteIdFiltro}, page=${i})}"
                   th:text="${i + 1}"></a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
