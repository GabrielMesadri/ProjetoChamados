<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chamado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container" style="max-width: 700px;">
    <h1 th:text="${chamadoForm.id} != null ? 'Editar chamado' : 'Abrir chamado'"></h1>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="${chamadoForm.id} != null ? @{/web/chamados/{id}(id=${chamadoForm.id})} : @{/web/chamados}"
          th:object="${chamadoForm}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Título</label>
            <input type="text" class="form-control" th:field="*{titulo}">
            <div class="text-danger small" th:if="${#fields.hasErrors('titulo')}" th:errors="*{titulo}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea class="form-control" th:field="*{descricao}" rows="4"></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Cliente</label>
                <select class="form-select" th:field="*{clienteId}">
                    <option value="">Selecione...</option>
                    <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('clienteId')}" th:errors="*{clienteId}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Categoria</label>
                <select class="form-select" th:field="*{categoriaId}">
                    <option value="">Selecione...</option>
                    <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('categoriaId')}" th:errors="*{categoriaId}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Prioridade</label>
                <select class="form-select" th:field="*{prioridade}">
                    <option value="">Selecione...</option>
                    <option th:each="p : ${prioridadeValues}" th:value="${p}" th:text="${p}"></option>
                </select>
                <div class="text-danger small" th:if="${#fields.hasErrors('prioridade')}" th:errors="*{prioridade}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Técnico (opcional)</label>
                <select class="form-select" th:field="*{tecnicoId}">
                    <option value="">Sem técnico atribuído</option>
                    <option th:each="t : ${tecnicos}" th:value="${t.id}" th:text="${t.nome}"></option>
                </select>
            </div>
        </div>

        <div class="mb-3" th:if="${chamadoForm.id} != null">
            <label class="form-label">Status</label>
            <select class="form-select" th:field="*{status}">
                <option th:each="s : ${statusValues}" th:value="${s}" th:text="${s}"></option>
            </select>
        </div>

        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-secondary" th:href="@{/web/chamados}">Cancelar</a>
    </form>
</div>
</body>
</html>
