<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chamado</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container" style="max-width: 800px;">
    <a th:href="@{/web/chamados}">&laquo; Voltar para chamados</a>

    <div th:if="${mensagem}" class="alert alert-success mt-2" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger mt-2" th:text="${erro}"></div>

    <div class="d-flex justify-content-between align-items-start mt-2 mb-3">
        <div>
            <h1 th:text="${chamado.titulo}"></h1>
            <span class="badge bg-secondary" th:text="${chamado.status}"></span>
            <span class="badge bg-warning text-dark" th:text="${chamado.prioridade}"></span>
        </div>
        <div>
            <a class="btn btn-outline-secondary" th:href="@{/web/chamados/{id}/editar(id=${chamado.id})}">Editar</a>
            <form th:action="@{/web/chamados/{id}/excluir(id=${chamado.id})}" method="post" class="d-inline"
                  onsubmit="return confirm('Excluir este chamado?');">
                <button class="btn btn-outline-danger" type="submit">Excluir</button>
            </form>
        </div>
    </div>

    <p th:text="${chamado.descricao}"></p>

    <ul class="list-unstyled text-muted">
        <li>Cliente: <a th:href="@{/web/clientes/{id}(id=${chamado.clienteId})}" th:text="${chamado.clienteNome}"></a></li>
        <li>Categoria: <span th:text="${chamado.categoriaNome}"></span></li>
        <li>Técnico: <span th:text="${chamado.tecnicoNome} ?: 'não atribuído'"></span></li>
        <li>Aberto em: <span th:text="${#temporals.format(chamado.dataAbertura, 'dd/MM/yyyy HH:mm')}"></span></li>
        <li th:if="${chamado.dataFechamento}">Fechado em: <span th:text="${#temporals.format(chamado.dataFechamento, 'dd/MM/yyyy HH:mm')}"></span></li>
    </ul>

    <div class="row g-3 mb-4" th:if="${chamado.status.name() != 'FECHADO'}">
        <div class="col-md-6">
            <form th:action="@{/web/chamados/{id}/atribuir(id=${chamado.id})}" method="post" class="d-flex gap-2">
                <select class="form-select" name="tecnicoId" required>
                    <option value="">Atribuir técnico...</option>
                    <option th:each="t : ${tecnicos}" th:value="${t.id}" th:text="${t.nome}"></option>
                </select>
                <button class="btn btn-outline-primary" type="submit">Atribuir</button>
            </form>
        </div>
        <div class="col-md-6">
            <form th:action="@{/web/chamados/{id}/status(id=${chamado.id})}" method="post" class="d-flex gap-2">
                <select class="form-select" name="status" required>
                    <option value="">Mudar status...</option>
                    <option th:each="s : ${statusValues}" th:value="${s}" th:text="${s}"></option>
                </select>
                <button class="btn btn-outline-primary" type="submit">Aplicar</button>
            </form>
        </div>
    </div>

    <h2 class="h5">Comentários</h2>
    <ul class="list-group mb-3">
        <li class="list-group-item" th:each="com : ${comentarios}">
            <div class="d-flex justify-content-between">
                <strong th:text="${com.autor}"></strong>
                <small class="text-muted" th:text="${#temporals.format(com.data, 'dd/MM/yyyy HH:mm')}"></small>
            </div>
            <div th:text="${com.texto}"></div>
        </li>
        <li class="list-group-item text-muted" th:if="${#lists.isEmpty(comentarios)}">Nenhum comentário ainda</li>
    </ul>

    <form th:action="@{/web/chamados/{id}/comentarios(id=${chamado.id})}" th:object="${comentarioForm}" method="post">
        <div class="mb-2">
            <input type="text" class="form-control" th:field="*{autor}" placeholder="Seu nome">
        </div>
        <div class="mb-2">
            <textarea class="form-control" th:field="*{texto}" rows="2" placeholder="Escreva um comentário..."></textarea>
        </div>
        <button class="btn btn-primary" type="submit">Comentar</button>
    </form>
</div>
</body>
</html>
