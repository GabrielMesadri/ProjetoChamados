<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categoria</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container" style="max-width: 600px;">
    <h1 th:text="${categoriaForm.id} != null ? 'Editar categoria' : 'Nova categoria'"></h1>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form th:action="${categoriaForm.id} != null ? @{/web/categorias/{id}(id=${categoriaForm.id})} : @{/web/categorias}"
          th:object="${categoriaForm}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text" class="form-control" th:field="*{nome}">
            <div class="text-danger small" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>
            <textarea class="form-control" th:field="*{descricao}" rows="3"></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></div>
        </div>

        <button class="btn btn-primary" type="submit">Salvar</button>
        <a class="btn btn-secondary" th:href="@{/web/categorias}">Cancelar</a>
    </form>
</div>
</body>
</html>
