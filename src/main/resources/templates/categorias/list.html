<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <div th:if="${mensagem}" class="alert alert-success" th:text="${mensagem}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Categorias</h1>
        <a class="btn btn-primary" th:href="@{/web/categorias/novo}">Nova categoria</a>
    </div>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>Nome</th>
            <th>Descrição</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${categorias}">
            <td th:text="${c.nome}"></td>
            <td th:text="${c.descricao}"></td>
            <td class="text-end">
                <a class="btn btn-sm btn-outline-secondary" th:href="@{/web/categorias/{id}/editar(id=${c.id})}">Editar</a>
                <form th:action="@{/web/categorias/{id}/excluir(id=${c.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Excluir esta categoria?');">
                    <button class="btn btn-sm btn-outline-danger" type="submit">Excluir</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(categorias)}">
            <td colspan="3" class="text-center text-muted">Nenhuma categoria cadastrada</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
