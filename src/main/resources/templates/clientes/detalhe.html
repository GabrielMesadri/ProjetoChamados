<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cliente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div class="container">
    <a th:href="@{/web/clientes}">&laquo; Voltar para clientes</a>

    <div class="d-flex justify-content-between align-items-center mt-2 mb-3">
        <div>
            <h1 th:text="${cliente.nome}"></h1>
            <p class="text-muted mb-0" th:text="${cliente.email}"></p>
            <p class="text-muted" th:text="${cliente.telefone}"></p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/web/clientes/{id}/editar(id=${cliente.id})}">Editar</a>
    </div>

    <h2 class="h5">Chamados deste cliente</h2>
    <table class="table table-hover">
        <thead>
        <tr>
            <th>Título</th>
            <th>Prioridade</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${chamados}">
            <td><a th:href="@{/web/chamados/{id}(id=${c.id})}" th:text="${c.titulo}"></a></td>
            <td th:text="${c.prioridade}"></td>
            <td th:text="${c.status}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(chamados)}">
            <td colspan="3" class="text-center text-muted">Nenhum chamado aberto por este cliente</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
